name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
  GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RELEASE_IT_PUSH_REPO: git@github.com:${{ github.repository }}.git
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get node version
        id: nvm
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@26
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: github.com

      - name: Configure git
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

      - name: Release
        id: release
        run: pnpm release --ci '--hooks.after:release=echo "version=${version}" >> "$GITHUB_OUTPUT"'

      - name: Notify release succeeded
        if: success() && steps.release.outputs.version != ''
        env:
          PUBLISHED_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm ga:notify success "[@b12k/gitleaks] Published $PUBLISHED_VERSION."

      - name: Notify release skipped
        if: success() && steps.release.outputs.version == ''
        run: pnpm ga:notify info "[@b12k/gitleaks] No new version to release."

      - name: Notify release failed
        if: failure()
        run: 'pnpm ga:notify error "[@b12k/gitleaks] Release failed. Logs: $RUN_URL"'
